spring.application.name=quizrace-api
logging.level.org.springframework.web=INFO
server.port=${PORT:8080}
spring.datasource.url=${QUIZ_DB_URL:jdbc:postgresql://localhost:5432/quizrace}
spring.datasource.username=${QUIZ_DB_USER:quizrace}
spring.datasource.password=${QUIZ_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=never
server.error.include-stacktrace=never
quiz.security.secret=${QUIZ_JWT_SECRET}
quiz.bootstrap.email=${QUIZ_ADMIN_EMAIL:}
quiz.bootstrap.password=${QUIZ_ADMIN_PASSWORD:}
